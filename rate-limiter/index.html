<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rate Limiter Simulator</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="simulator">
    <div class="tabs">
      <button class="tab active" data-algorithm="fixed">Fixed window</button>
      <button class="tab" data-algorithm="sliding">Sliding counter</button>
      <button class="tab" data-algorithm="log">Sliding log</button>
      <button class="tab" data-algorithm="token">Token bucket</button>
      <button class="tab" data-algorithm="leaky">Leaky bucket</button>
    </div>

    <div class="control"><label>Limit per window</label><input id="limit" type="range" min="1" max="20" value="8"><span id="limitValue">8</span></div>
    <div class="control"><label>Window length</label><input id="window" type="range" min="1" max="20" value="8"><span id="windowValue">8s</span></div>
    <div class="control"><label>Arrival rate</label><input id="rate" type="range" min="1" max="10" value="2"><span id="rateValue">2/s</span></div>

    <div class="actions"><button id="playButton">▷&nbsp; Play</button><button id="resetButton">↻&nbsp; Reset</button></div>

    <div class="stream-title">request stream (newest on the right) — <span class="legend allowed-dot"></span> allowed <span class="legend denied-dot"></span> denied</div>
    <div id="stream" class="stream"><span class="placeholder">press play...</span></div>

    <div id="metricLabel" class="metric-label">window count 0 / 8</div>
    <div class="progress"><div id="progressBar"></div></div>

    <div class="stats"><span>allowed <strong id="allowed">0</strong></span><span>denied <strong id="denied">0</strong></span><span>t = <span id="time">0.0</span>s</span></div>
  </div>
</body>
</html>
